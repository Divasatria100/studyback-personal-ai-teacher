services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: studyback_postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-studyback}
      POSTGRES_USER: ${DB_USERNAME:-studyback}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studyback_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-studyback} -d ${DB_DATABASE:-studyback}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - studyback_network

  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyback_backend
    working_dir: /var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Studyback}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-studyback}
      DB_USERNAME: ${DB_USERNAME:-studyback}
      DB_PASSWORD: ${DB_PASSWORD:-studyback_password}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studyback_network
    command: php artisan serve --host=0.0.0.0 --port=8000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyback_frontend
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - studyback_network
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: studyback_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
      - frontend
    networks:
      - studyback_network

networks:
  studyback_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_vendor:
    driver: local
  backend_storage:
    driver: local
  frontend_node_modules:
    driver: local
